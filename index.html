<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あちゃーひダイス</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f0f0f;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-container {
            width: 100vw;
            height: 65vh;
            position: relative;
        }

        #ui-container {
            height: 35vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: white;
            position: relative;
            padding-top: 5px;
        }

        #status, #result, button {
            transition: opacity 1.2s ease-in-out, transform 0.4s ease;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .fade-in {
            opacity: 1;
            pointer-events: auto;
        }

        #status {
            font-size: 1.1rem;
            color: #aaa;
            height: 1.3rem;
            margin-bottom: 2px;
        }

        #result {
            font-size: 2.0rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 8px;
            height: 2.5rem;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
            letter-spacing: 4px;
        }

        #roll-btn {
            padding: 10px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            margin-bottom: 8px;
        }

        #roll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6);
        }

        #roll-btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.3;
        }

        /* 右上のコントロール群（歯車と電球） */
        .top-right-control {
            position: absolute;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
        }

        .top-right-control:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        #sound-config-btn {
            top: 15px;
        }

        #achievement-btn {
            top: 65px;
        }

        /* サウンド設定ポップアップウィンドウ */
        #sound-modal {
            position: absolute;
            top: 115px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 12px;
            z-index: 200;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            gap: 12px;
            min-width: 200px;
        }

        #sound-modal.open {
            display: flex;
        }

        /* 実績画面の背景ディマー ＆ ウィンドウ */
        #achievement-dimmer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #achievement-dimmer.open {
            display: flex;
            opacity: 1;
        }

        #achievement-modal {
            background: rgba(25, 25, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 85vw;
            max-width: 650px;
            height: 75vh;
            max-height: 550px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 30px;
            color: white;
            box-sizing: border-box;
        }

        #achievement-close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        #achievement-close-btn:hover {
            color: #fff;
        }

        .achievement-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* 横3列グリッドレイアウト */
        .achievement-grid {
            flex-grow: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-right: 5px;
        }

        /* 正方形の実績ボックス */
        .achievement-box {
            width: 110px;
            height: 110px;
            margin: auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .achievement-box.locked {
            opacity: 0.4;
            filter: grayscale(100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .achievement-box.locked:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.05);
        }

        .achievement-box.bronze {
            border: 2px solid #cd7f32;
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.15), rgba(25, 25, 25, 0.95));
            box-shadow: 0 0 10px rgba(205, 127, 50, 0.3);
        }
        .achievement-box.bronze:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(205, 127, 50, 0.5);
        }

        .achievement-box.silver {
            border: 2px solid #c0c0c0;
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.15), rgba(25, 25, 25, 0.95));
            box-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }
        .achievement-box.silver:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.5);
        }

        .achievement-box.gold {
            border: 2px solid #ffd700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(25, 25, 25, 0.95));
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }
        .achievement-box.gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }

        .achievement-box img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        /* 詳細ポップアップ */
        #achievement-detail-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.98);
            border-radius: 16px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
            z-index: 10;
        }

        #achievement-detail-view.open {
            display: flex;
        }

        .detail-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.5));
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .detail-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .detail-desc {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .detail-time {
            font-size: 0.85rem;
            color: #aaa;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-back-btn {
            margin-top: 25px;
            padding: 8px 25px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .detail-back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #ddd;
        }

        .setting-row.sub {
            padding-left: 10px;
            font-size: 0.85rem;
            color: #bbb;
        }

        .setting-row.column {
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .setting-row.column input[type="range"] {
            width: 100%;
            accent-color: #e74c3c;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: 0.3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #e74c3c;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* 統計情報の表示エリア */
        #stats-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #ccc;
            max-width: 95vw;
        }

        .stat-item span {
            color: #f1c40f;
            font-weight: bold;
            margin-left: 2px;
        }

        #acha-banner {
            position: absolute;
            top: 37.5vh;
            transform: translateY(-50%);
            left: 120vw;
            white-space: nowrap;
            font-size: 40vw;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9), 
                         0 0 60px rgba(255, 215, 0, 0.9), 
                         0 0 100px rgba(243, 156, 18, 0.8);
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1vw;
            opacity: 0;
            line-height: 1;
        }

        #acha-banner.gold-mode {
            color: #fff8d6;
            text-shadow: 0 0 20px #ffffff,
                         0 0 50px #ffd700,
                         0 0 90px #ffaa00,
                         0 0 130px #d4af37;
        }

        #pity-banner {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 
                -1px -1px 0 #000, 1px -1px 0 #000,
                -1px  1px 0 #000, 1px  1px 0 #000,
                0 0 8px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 105;
            display: none;
            letter-spacing: 2px;
        }

        .blink-pity {
            animation: blinkAnim 1s ease-in-out infinite;
        }

        @keyframes blinkAnim {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }

        .flow-acha {
            animation: flowLeft 3s linear forwards;
        }

        @keyframes flowLeft {
            0% {
                left: 120vw;
                opacity: 0.95;
            }
            100% {
                left: -250vw;
                opacity: 0.95;
            }
        }

        #story-overlay {
            position: absolute;
            top: 37.5vh;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 150;
            text-align: center;
            width: 100%;
        }

        .story-line {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.55);
            padding: 10px 30px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .story-line.show {
            opacity: 1;
        }

        /* 実績解除ポップアップ通知 */
        #achievement-popup {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 25, 25, 0.95);
            border: 1px solid rgba(241, 196, 15, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            z-index: 400;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        #achievement-popup.show {
            top: 20px;
        }

        #achievement-popup img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(241, 196, 15, 0.5));
        }

        #achievement-popup .popup-text-wrap {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        #achievement-popup .popup-sub {
            font-size: 0.75rem;
            color: #f1c40f;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #achievement-popup .popup-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <!-- 実績解除ポップアップ通知 -->
    <div id="achievement-popup">
        <img id="popup-icon" src="achahi.png" alt="実績アイコン">
        <div class="popup-text-wrap">
            <span class="popup-sub">実績解除！</span>
            <span id="popup-name" class="popup-name">初めの一投</span>
        </div>
    </div>

    <!-- 右上コントロール群：歯車（サウンド設定）＆ 電球（実績） -->
    <button id="sound-config-btn" class="top-right-control" title="サウンド設定">⚙️</button>
    <button id="achievement-btn" class="top-right-control" title="実績">💡</button>

    <!-- サウンド設定ポップアップウィンドウ -->
    <div id="sound-modal">
        <div class="setting-row column">
            <span>全体音量: <span id="master-vol-val">100</span>%</span>
            <input type="range" id="master-volume" min="0" max="100" value="100">
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 2px 0;">
        <div class="setting-row">
            <span>BGM</span>
            <label class="switch">
                <input type="checkbox" id="toggle-bgm" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row sub">
            <span>┗ 通常BGMだけ</span>
            <label class="switch">
                <input type="checkbox" id="toggle-normal-bgm" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <span>ボイス</span>
            <label class="switch">
                <input type="checkbox" id="toggle-voice" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 実績ポップアップウィンドウ（背景ディマー付き） -->
    <div id="achievement-dimmer">
        <div id="achievement-modal">
            <button id="achievement-close-btn">&times;</button>
            <div class="achievement-title">🏆 実績一覧</div>
            
            <!-- 横3列のグリッド表示エリア -->
            <div class="achievement-grid" id="achievement-grid">
                <!-- JavaScriptで自動生成されます -->
            </div>

            <!-- クリック時の詳細ビュー -->
            <div id="achievement-detail-view">
                <img id="detail-img" class="detail-img" src="" alt="実績アイコン">
                <div id="detail-name" class="detail-name">実績名</div>
                <div id="detail-desc" class="detail-desc">実績の達成内容説明</div>
                <div id="detail-time" class="detail-time">達成日時: 未達成</div>
                <button class="detail-back-btn" id="detail-back-btn">戻る</button>
            </div>
        </div>
    </div>

    <div id="acha-banner">ACHA</div>
    <div id="pity-banner" class="blink-pity">確定演出ｷﾁｬｰﾋ</div>

    <div id="story-overlay">
        <div id="line-1" class="story-line">あちゃーひはずっと見ていた</div>
        <div id="line-2" class="story-line">ただただ、、、ずっと見ていた</div>
    </div>

    <div id="canvas-container"></div>
    <div id="ui-container">
        <div id="status">準備完了</div>
        <div id="result">【 あ ち ゃ ー ひ 】</div>
        <button id="roll-btn">壺皿に投げる</button>
        
        <!-- 統計情報の表示エリア -->
        <div id="stats-board">
            <div class="stat-item">試行回数: <span id="stat-total">0</span></div>
            <div class="stat-item">あちゃ回数: <span id="stat-acha">0 (0.0%)</span></div>
            <div class="stat-item">あちゃー回数: <span id="stat-achader">0 (0.0%)</span></div>
            <div class="stat-item">あちゃひ回数: <span id="stat-achahi">0 (0.0%)</span></div>
            <div class="stat-item">あちゃーひ回数: <span id="stat-max">0 (0.0%)</span></div>
            <div class="stat-item">あちゃ連続(現在): <span id="stat-streak-curr">0</span></div>
            <div class="stat-item">あちゃ連続(最高): <span id="stat-streak-max">0</span></div>
        </div>
    </div>

    <script>
        // サウンド設定の状態管理
        const soundSettings = {
            masterVolume: 1.0,
            bgm: true,
            normalBgm: true,
            voice: true
        };

        const configBtn = document.getElementById('sound-config-btn');
        const soundModal = document.getElementById('sound-modal');
        const masterVolumeInput = document.getElementById('master-volume');
        const masterVolVal = document.getElementById('master-vol-val');
        const toggleBgm = document.getElementById('toggle-bgm');
        const toggleNormalBgm = document.getElementById('toggle-normal-bgm');
        const toggleVoice = document.getElementById('toggle-voice');

        // 実績ウィンドウ関連の要素
        const achievementBtn = document.getElementById('achievement-btn');
        const achievementDimmer = document.getElementById('achievement-dimmer');
        const achievementCloseBtn = document.getElementById('achievement-close-btn');
        const achievementGrid = document.getElementById('achievement-grid');
        const achievementDetailView = document.getElementById('achievement-detail-view');
        const detailImg = document.getElementById('detail-img');
        const detailName = document.getElementById('detail-name');
        const detailDesc = document.getElementById('detail-desc');
        const detailTime = document.getElementById('detail-time');
        const detailBackBtn = document.getElementById('detail-back-btn');

        // 実績解除ポップアップ用要素 ＆ キュー管理
        const achievementPopup = document.getElementById('achievement-popup');
        const popupIcon = document.getElementById('popup-icon');
        const popupName = document.getElementById('popup-name');
        
        const piconAudio = new Audio('picon.mp3');
        const chonAudio = new Audio('chon.mp3');

        let achievementQueue = [];
        let isPopupShowing = false;

        function processAchievementQueue() {
            if (isPopupShowing || achievementQueue.length === 0) return;

            isPopupShowing = true;
            const currentAch = achievementQueue.shift();

            popupName.textContent = currentAch.name;
            popupIcon.src = currentAch.icon;
            
            if (soundSettings.voice && soundSettings.masterVolume > 0) {
                piconAudio.currentTime = 0;
                piconAudio.volume = soundSettings.masterVolume;
                piconAudio.play().catch(e => console.log('picon.mp3 再生エラー:', e));
            }

            achievementPopup.classList.add('show');

            setTimeout(() => {
                achievementPopup.classList.remove('show');
                setTimeout(() => {
                    isPopupShowing = false;
                    processAchievementQueue();
                }, 400);
            }, 3500);
        }

        function queueAchievementPopup(achName, achIcon) {
            achievementQueue.push({ name: achName, icon: achIcon });
            processAchievementQueue();
        }

        configBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            achievementDimmer.classList.remove('open');
            soundModal.classList.toggle('open');
        });

        achievementBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundModal.classList.remove('open');
            renderAchievements();
            achievementDimmer.classList.add('open');
        });

        const closeAchievementModal = () => {
            achievementDimmer.classList.remove('open');
            achievementDetailView.classList.remove('open');
        };

        achievementCloseBtn.addEventListener('click', closeAchievementModal);
        detailBackBtn.addEventListener('click', () => {
            achievementDetailView.classList.remove('open');
        });

        achievementDimmer.addEventListener('click', (e) => {
            if (e.target === achievementDimmer) {
                closeAchievementModal();
            }
        });

        window.addEventListener('click', (e) => {

                if (!activeBGM && !winAudio.paused && winAudio.currentTime > 0) activeBGM = winAudio;

                if (!activeBGM) {
                    clearInterval(bgmFadeTimer);
                    return;
                }

                const currentTarget = typeof targetBGMVolume === 'function' ? targetBGMVolume() : targetBGMVolume;

                if (Math.abs(activeBGM.volume - currentTarget) < 0.05) {
                    activeBGM.volume = currentTarget;
                    clearInterval(bgmFadeTimer);
                } else {
                    activeBGM.volume += (currentTarget > activeBGM.volume) ? 0.05 : -0.05;
                }
            }, 30);

            sfx.volume = soundSettings.masterVolume;
            sfx.play().catch(e => console.log(`${sfxKey} 再生エラー:`, e));

            soundMonitor = setInterval(() => {

            if (activeRoll) {

                    if (activeRoll.volume > 0.05) {
                        activeRoll.volume -= 0.05;
                    } else {
                        activeRoll.volume = 0;
                        activeRoll.pause();
                        clearInterval(rollFadeTimer);
                    }
                }, 100);
            }

            if (isMaxCombo && soundSettings.bgm) {
                setTimeout(() => {
                    winAudio.currentTime = 0;
                    winAudio.volume = 0;
                    targetBGMVolume = BGM_VOL_NORMAL;
                    winAudio.play().catch(e => console.log('オーディオ再生エラー:', e));

                    winFadeTimer = setInterval(() => {

        function createCharTexture(char) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#fdfbf7';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#e0dacf';
            ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, 256, 256);

            if (char) {
                ctx.save();
                ctx.translate(128, 128);

                if (char === 'ち') {
                    ctx.rotate(Math.PI / 2);
                } else if (char === 'あ') {
                    ctx.rotate(-Math.PI / 2);
                }

                ctx.fillStyle = (char === 'あ') ? '#c0392b' : '#2c3e50';
                ctx.font = 'bold 140px "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char, 0, 10);
                
                ctx.restore();
            }

            return new THREE.CanvasTexture(canvas);
        }

                            if (achaCameraCount === 0) return;
                            achaCameraCount++;
                            runLoop();
                        });
                    }
                } else {
                    playNormalCameraSequence(currentSessionId, () => {
                        if (rollSessionId !== currentSessionId) return;
                        if (achaCameraCount === 0) return;

                        achaCameraCount++;

                        if (achaCameraCount === 2) {
                            if (onFirstComplete) onFirstComplete();
                        }

                        runLoop();
                    });
                }
            }

            runLoop();
        }

        function playAchahiSpecialCameraSequence(currentSessionId, onComplete) {
            startAchaHiBGM();

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                setCameraPos(350, 4.0, 0, 3500, 500, 0, 0);
            }, 0);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                setCameraPos(460, 2.5, -15, 4000, 500, 0, 0);
            }, 3700);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                line1.classList.add('show');
            }, 8000);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                line2.classList.add('show');
            }, 11500);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                line1.classList.remove('show');
                line2.classList.remove('show');
            }, 16500);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                setCameraPos(camResetPos.x, camResetPos.y, camResetPos.z, 3500, 0, 0, 0);
            }, 17500);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                if (onComplete) onComplete();
            }, 21500);
        }

        function getTopChar(dice) {
            let maxDot = -Infinity;
            let topChar = '';
            const worldUp = new THREE.Vector3(0, 1, 0);

            faceNormals.forEach(fn => {
                const normal = fn.vector.clone().applyQuaternion(dice.quaternion);
                const dot = normal.dot(worldUp);
                if (dot > maxDot) {
                    maxDot = dot;
                    topChar = charList[fn.charIndex];
                }
            });
            return topChar;
        }

        function kakutei(initialResults) {
            let requiredChars = ['あ', 'ち', 'ゃ'];
            let currentChars = [...initialResults];
            let correctionTargets = {};

            let missingChars = [];
            requiredChars.forEach(req => {
                const idx = currentChars.indexOf(req);
                if (idx !== -1) {
                    currentChars[idx] = null;
                } else {
                    missingChars.push(req);
                }
            });

            if (missingChars.length > 0) {
                let availableIndices = [];
                currentChars.forEach((c, i) => {
                    if (c !== null) {
                        availableIndices.push(i);
                    }
                });

                missingChars.forEach(missingChar => {
                    if (availableIndices.length > 0) {
                        let targetDiceIdx = availableIndices.shift();
                        correctionTargets[targetDiceIdx] = missingChar;
                    }
                });
            }

            return correctionTargets;
        }

        const btn = document.getElementById('roll-btn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const achaBanner = document.getElementById('acha-banner');
        const pityBanner = document.getElementById('pity-banner');

        let isSpecialActiveThisRoll = false;

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            btn.disabled = true;

            // 投げるボタンを押した瞬間にテキストを必ずデフォルトに戻す
            line1.textContent = "あちゃーひはずっと見ていた";
            line2.textContent = "ただただ、、、ずっと見ていた";

            rollSessionId++;
            const currentSessionId = rollSessionId;

            achaCameraCount = 0;

            const isMaxBuffActive = (stats.buffCount >= 3);
            if (isMaxBuffActive) {
                stats.buffCount = 0;
                updateStatsUI();
            }

            const isPityActive = (stats.notAchaStreak >= 8);
            isSpecialActiveThisRoll = (isMaxBuffActive || isPityActive);

            if (isSpecialActiveThisRoll) {
                stats.unlockedKakuzenFever = true;
            }

            TWEEN.removeAll();
            clearTimeout(achaBgmTimer);
            achaBanner.style.display = 'none';
            achaBanner.classList.remove('flow-acha', 'gold-mode');
            
            pityBanner.style.display = 'none';

            line1.classList.remove('show');
            line2.classList.remove('show');

            startRollBGM(isSpecialActiveThisRoll);

            if (isSpecialActiveThisRoll) {
                pityBanner.style.display = 'block';
            }

            resultDiv.classList.add('fade-out');
            btn.classList.add('fade-out');

            statusDiv.textContent = 'いざ、尋常...！';
            setCameraPos(0, 6, 9, 1600, 0, 0, 0);

            diceArray.forEach((dice, index) => {
                const startX = (Math.random() - 0.5) * 3.5;
                const startZ = (Math.random() - 0.5) * 3.5;
                
                dice.position.set(startX, 4.5 + index * 0.25, startZ);
                dice.rotation.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);

                const angle = (index / 5) * Math.PI * 2 + (Math.random() * 0.4 - 0.2);
                const radius = 0.8 + Math.random() * 0.5; 
                const landX = Math.cos(angle) * radius;
                const landZ = Math.sin(angle) * radius;

                new TWEEN.Tween(dice.position)
                    .to({ x: landX, y: -0.15, z: landZ }, 5000)
                    .easing(TWEEN.Easing.Bounce.Out)
                    .start();

                new TWEEN.Tween(dice.rotation)
                    .to({ 
                        x: dice.rotation.x + Math.PI * (8 + index * 2), 
                        y: dice.rotation.y + Math.PI * (6 + index * 2), 
                        z: dice.rotation.z + Math.PI * (8 + index * 2) 
                    }, 5000)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            });

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                statusDiv.textContent = '壺皿の中で交錯！';
                setCameraPos(2.5, 1.2, 2.5, 1200, 0, 0, 0);
            }, 3000);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                const HALF_PI = Math.PI / 2;

                diceArray.forEach((dice) => {
                    const targetX = Math.round(dice.rotation.x / HALF_PI) * HALF_PI;
                    const targetY = Math.round(dice.rotation.y / HALF_PI) * HALF_PI;
                    const targetZ = Math.round(dice.rotation.z / HALF_PI) * HALF_PI;

                    new TWEEN.Tween(dice.rotation)
                        .to({ x: targetX, y: targetY, z: targetZ }, 600)
                        .easing(TWEEN.Easing.Quadratic.Out)
                        .start();
                });
            }, 5000);

            setTimeout(() => {
                if (rollSessionId !== currentSessionId) return;
                const initialResults = diceArray.map(dice => getTopChar(dice));

                let needsCorrection = false;
                let correctionTargets = {};

                if (isSpecialActiveThisRoll) {
                    correctionTargets = kakutei(initialResults);
                    if (Object.keys(correctionTargets).length > 0) {
                        needsCorrection = true;
                    }
                }

                const rawResults = diceArray.map(dice => getTopChar(dice));
                const hasA_raw    = rawResults.includes('あ');
                const hasChi_raw  = rawResults.includes('ち');
                const hasYa_raw   = rawResults.includes('ゃ');
                const hasDash_raw = rawResults.includes('ー');
                const hasHi_raw   = rawResults.includes('ひ');
                const isInitialMaxCombo = (hasA_raw && hasChi_raw && hasYa_raw && hasDash_raw && hasHi_raw);

                // 【救済演出の判定】notあちゃーひ連続回数 >= 80 かつ 初期結果が「あちゃーひ」ではない(役なし)場合
                let isSalvationTriggered = false;
                if (stats.notAchahiStreak >= 80 && !isInitialMaxCombo && !needsCorrection) {
                    isSalvationTriggered = true;
                }

                if (isSalvationTriggered) {
                    stopAllRollAudio();

                    statusDiv.textContent = '…………';
                    
                    setTimeout(() => {
                        if (rollSessionId !== currentSessionId) return;

                        if (soundSettings.voice && soundSettings.masterVolume > 0) {
                            chonAudio.currentTime = 0;
                            chonAudio.volume = soundSettings.masterVolume;
                            chonAudio.play().catch(e => console.log('chon.mp3 再生エラー:', e));
                        }

                        const salvationTargets = ['あ', 'ち', 'ゃ', 'ー', 'ひ'];
                        diceArray.forEach((dice, i) => {
                            const targetChar = salvationTargets[i];
                            const rot = targetRotations[targetChar];
                            new TWEEN.Tween(dice.rotation)
                                .to({ x: rot.x + Math.PI * 2, y: rot.y + Math.PI * 2, z: rot.z }, 800)
                                .easing(TWEEN.Easing.Cubic.Out)
                                .start();
                        });

                    }, 2000);
                } else if (Object.keys(correctionTargets).length > 0) {
                    Object.keys(correctionTargets).forEach(i => {
                        const dice = diceArray[i];
                        const targetChar = correctionTargets[i];
                        const rot = targetRotations[targetChar];

                        new TWEEN.Tween(dice.rotation)
                            .to({ x: rot.x, y: rot.y, z: rot.z }, 800)
                            .easing(TWEEN.Easing.Cubic.Out)
                            .start();
                    });
                }

                const finalEvalDelay = isSalvationTriggered ? 2800 : ((Object.keys(correctionTargets).length > 0) ? 1000 : 200);

                setTimeout(() => {
                    if (rollSessionId !== currentSessionId) return;
                    
                    pityBanner.style.display = 'none';

                    const finalRawResults = diceArray.map(dice => getTopChar(dice));

                    const hasA    = finalRawResults.includes('あ');
                    const hasChi  = finalRawResults.includes('ち');
                    const hasYa   = finalRawResults.includes('ゃ');
                    const hasDash = finalRawResults.includes('ー');
                    const hasHi   = finalRawResults.includes('ひ');

                    stats.total++;

                    let fixedChars = [];
                    let bannerText = '';
                    let isMaxCombo = false;
                    let isAchahiOnly = false;

                    if (hasA && hasChi && hasYa && hasDash && hasHi) {
                        fixedChars = ['あ', 'ち', 'ゃ', 'ー', 'ひ'];
                        bannerText = 'ACHA-HI';
                        isMaxCombo = true;
                        stats.achaDashHi++;
                    } else if (hasA && hasChi && hasYa && hasDash) {
                        fixedChars = ['あ', 'ち', 'ゃ', 'ー'];
                        bannerText = 'ACHA-';
                        stats.achaDash++;
                        playSFXWithDucking('achaDash');
                    } else if (hasA && hasChi && hasYa && hasHi) {
                        fixedChars = ['あ', 'ち', 'ゃ', 'ひ'];
                        bannerText = 'ACHAHI';
                        stats.achaHi++;
                        isAchahiOnly = true;
                        playSFXWithDucking('achaHi');
                    } else if (hasA && hasChi && hasYa) {
                        fixedChars = ['あ', 'ち', 'ゃ'];
                        bannerText = 'ACHA';
                        stats.acha++;
                        playSFXWithDucking('acha');
                    }

                    const isHit = (bannerText !== '');

                    if (isHit) {
                        stats.streakCurr++;
                        if (stats.streakCurr > stats.streakMax) {
                            stats.streakMax = stats.streakCurr;
                        }
                        stats.notAchaStreak = 0;

                        const buffAdd = (bannerText === 'ACHA') ? 1 : 2;
                        stats.buffCount = Math.min(3, stats.buffCount + buffAdd);
                    } else {
                        stats.streakCurr = 0;
                        stats.notAchaStreak++;
                        stats.buffCount = 0;
                    }

                    // --- notあちゃーひ連続回数のカウント処理 ---
                    if (isMaxCombo) {
                        stats.notAchahiStreak = 0;
                    } else {
                        stats.notAchahiStreak++;
                    }
                    // ------------------------------------------

                    // --- 実績「、、、どんまい」の判定（救済演出を見る） ---
                    if (isSalvationTriggered) {
                        stats.unlockedSalvation = true;
                    }
                    // --------------------------------------------------------

                    // --- 実績「その幻想をぶち壊す！」の判定 ---
                    if (isSpecialActiveThisRoll && !needsCorrection && isMaxCombo && !isSalvationTriggered) {
                        stats.unlockedSmashIllusion = true;
                    }
                    // ---------------------------------------------

                    // --- 連続系実績の判定 & カウント更新 ---
                    const isValidAchaStreakHit = (bannerText === 'ACHA' || bannerText === 'ACHA-' || bannerText === 'ACHAHI' || bannerText === 'ACHA-HI');
                    
                    if (stats.achaStreak >= 2 && isAchahiOnly) {
                        stats.unlockedAchaAchahi = true;
                    }

                    if (stats.achaStreak === 2 && isValidAchaStreakHit) {
                        stats.unlockedAchaThreeTimes = true;
                    }

                    if (isValidAchaStreakHit) {
                        stats.achaStreak++;
                    } else {
                        stats.achaStreak = 0;
                    }

                    if (stats.achahiStreak === 1 && isMaxCombo) {
                        stats.unlockedCheatTwice = true;
                    }

                    if (isMaxCombo) {
                        stats.achahiStreak++;
                    } else {
                        stats.achahiStreak = 0;
                    }
                    // ----------------------------------------

                    updateStatsUI();

                    let finalResults = [];
                    const isSuccess = isHit;

                    transitionBGM(isMaxCombo);

                    if (isSuccess) {
                        let remainingChars = [...finalRawResults];
                        fixedChars.forEach(char => {
                            const idx = remainingChars.indexOf(char);
                            if (idx !== -1) {
                                remainingChars.splice(idx, 1);
                            }
                        });
                        finalResults = [...fixedChars, ...remainingChars];

                        if (isMaxCombo) {
                            achaBanner.classList.add('gold-mode');
                        } else {
                            achaBanner.classList.remove('gold-mode');
                        }

                        achaBanner.textContent = bannerText;
                        achaBanner.style.display = 'block';
                        achaBanner.classList.remove('flow-acha');
                        void achaBanner.offsetWidth;
                        achaBanner.classList.add('flow-acha');
                    } else {
                        finalResults = finalRawResults;
                    }

                    const displayDelay = isSuccess ? 3000 : 1000;

                    setTimeout(() => {
                        if (rollSessionId !== currentSessionId) return;
                        
                        achaBanner.style.display = 'none';
                        achaBanner.classList.remove('flow-acha');

                        if (isSalvationTriggered) {
                            statusDiv.textContent = '🎉 奇跡の救済演出！あちゃーひ！ 🎉';
                        } else if (Object.keys(correctionTargets).length > 0) {
                            statusDiv.textContent = '✨ 謎の力でさいころが動いた……！ ✨';
                        } else {
                            statusDiv.textContent = isMaxCombo ? '🎉 完全制覇！あちゃーひ！ 🎉' : '勝負あり！';
                        }
                        resultDiv.textContent = `【 ${finalResults.join(' ')} 】`;

                        resultDiv.classList.remove('fade-out');

                        if (isMaxCombo) {
                            startAchaHiCameraShow(currentSessionId, isSalvationTriggered, () => {
                                if (rollSessionId !== currentSessionId) return;
                                btn.classList.remove('fade-out');
                                isRolling = false;
                                btn.disabled = false;
                            });
                        } else {
                            btn.classList.remove('fade-out');
                            isRolling = false;
                            btn.disabled = false;
                        }

                    }, displayDelay);

                }, finalEvalDelay);

            }, 5800);
        }

        function resolveCollisions() {
            const minDistance = 0.78;

            for (let i = 0; i < diceArray.length; i++) {
                for (let j = i + 1; j < diceArray.length; j++) {
                    const d1 = diceArray[i];
                    const d2 = diceArray[j];

                    const dx = d2.position.x - d1.position.x;
                    const dz = d2.position.z - d1.position.z;
                    const dist = Math.hypot(dx, dz);

                    if (dist < minDistance && dist > 0) {
                        const overlap = minDistance - dist;
                        const nx = dx / dist;
                        const nz = dz / dist;

                        d1.position.x -= nx * (overlap * 0.5);
                        d1.position.z -= nz * (overlap * 0.5);
                        d2.position.x += nx * (overlap * 0.5);
                        d2.position.z += nz * (overlap * 0.5);
                    }
                }
            }
        }

        btn.addEventListener('click', rollDice);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            resolveCollisions();
            
            camera.up.set(0, 1, 0);

            if (isRolling) {
                let avgX = 0, avgY = 0, avgZ = 0;
                diceArray.forEach(d => {
                    avgX += d.position.x;
                    avgY += d.position.y;
                    avgZ += d.position.z;
                });
                if (camera.position.z > 1.0) {
                    camera.lookAt(avgX / 5, (avgY / 5) + 0.2, avgZ / 5);
                } else {
                    camera.lookAt(0, 0, 0);
                }
            } else {
                camera.lookAt(cameraTarget);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
