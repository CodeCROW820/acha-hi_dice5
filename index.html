<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あちゃダイス</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            overflow-x: hidden;
            background-color: #0f0f0f;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-container {
            width: 100%;
            height: 65vh;
            position: relative;
        }

        #ui-container {
            height: 35vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: white;
            position: relative;
            padding-top: 5px;
        }

        #status, #result, button {
            transition: opacity 1.2s ease-in-out, transform 0.4s ease;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .fade-in {
            opacity: 1;
            pointer-events: auto;
        }

        #status {
            font-size: 1.1rem;
            color: #aaa;
            height: 1.3rem;
            margin-bottom: 2px;
        }

        #result {
            font-size: 2.0rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 8px;
            height: 2.5rem;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
            letter-spacing: 4px;
        }

        #roll-btn {
            padding: 10px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            margin-bottom: 8px;
        }

        #roll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6);
        }

        #roll-btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.3;
        }

        /* コントロール群（右上歯車と電球） */
        .top-control {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            z-index: 200;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .top-control:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .top-right-control {
            right: 20px;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sound-config-btn {
            top: 15px;
        }

        #achievement-btn {
            top: 65px;
        }

        /* サウンド設定ポップアップウィンドウ */
        #sound-modal {
            position: absolute;
            top: 115px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 12px;
            z-index: 200;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            gap: 12px;
            min-width: 200px;
        }

        #sound-modal.open {
            display: flex;
        }

        /* 実績画面の背景ディマー ＆ ウィンドウ */
        #achievement-dimmer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #achievement-dimmer.open {
            display: flex;
            opacity: 1;
        }

        #achievement-modal {
            background: rgba(25, 25, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 85vw;
            max-width: 650px;
            height: 75vh;
            max-height: 550px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 30px;
            color: white;
            box-sizing: border-box;
        }

        #achievement-close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        #achievement-close-btn:hover {
            color: #fff;
        }

        .achievement-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* 横3列グリッドレイアウト */
        .achievement-grid {
            flex-grow: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-right: 5px;
        }

        /* 正方形の実績ボックス */
        .achievement-box {
            width: 110px;
            height: 110px;
            margin: auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .achievement-box.locked {
            opacity: 0.4;
            filter: grayscale(100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .achievement-box.locked:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.05);
        }

        .achievement-box.bronze {
            border: 2px solid #cd7f32;
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.15), rgba(25, 25, 25, 0.95));
            box-shadow: 0 0 10px rgba(205, 127, 50, 0.3);
        }
        .achievement-box.bronze:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(205, 127, 50, 0.5);
        }

        .achievement-box.silver {
            border: 2px solid #c0c0c0;
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.15), rgba(25, 25, 25, 0.95));
            box-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }
        .achievement-box.silver:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.5);
        }

        .achievement-box.gold {
            border: 2px solid #ffd700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(25, 25, 25, 0.95));
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }
        .achievement-box.gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }

        .achievement-box img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        /* 詳細ポップアップ */
        #achievement-detail-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.98);
            border-radius: 16px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
            z-index: 10;
        }

        #achievement-detail-view.open {
            display: flex;
        }

        .detail-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.5));
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .detail-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .detail-desc {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .detail-time {
            font-size: 0.85rem;
            color: #aaa;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-back-btn {
            margin-top: 25px;
            padding: 8px 25px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .detail-back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #ddd;
        }

        .setting-row.sub {
            padding-left: 10px;
            font-size: 0.85rem;
            color: #bbb;
        }

        .setting-row.column {
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .setting-row.column input[type="range"] {
            width: 100%;
            accent-color: #e74c3c;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: 0.3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #e74c3c;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* 統計情報の表示エリア */
        #stats-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #ccc;
            max-width: 95vw;
        }

        .stat-item span {
            color: #f1c40f;
            font-weight: bold;
            margin-left: 2px;
        }

        #acha-banner {
            position: absolute;
            top: 37.5vh;
            transform: translateY(-50%);
            left: 120vw;
            white-space: nowrap;
            font-size: 40vw;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9), 
                         0 0 60px rgba(255, 215, 0, 0.9), 
                         0 0 100px rgba(243, 156, 18, 0.8);
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1vw;
            opacity: 0;
            line-height: 1;
        }

        #acha-banner.gold-mode {
            color: #fff8d6;
            text-shadow: 0 0 20px #ffffff,
                         0 0 50px #ffd700,
                         0 0 90px #ffaa00,
                         0 0 130px #d4af37;
        }

        #pity-banner {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 
                -1px -1px 0 #000, 1px -1px 0 #000,
                -1px  1px 0 #000, 1px  1px 0 #000,
                0 0 8px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 105;
            display: none;
            letter-spacing: 2px;
        }

        .blink-pity {
            animation: blinkAnim 1s ease-in-out infinite;
        }

        @keyframes blinkAnim {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }

        .flow-acha {
            animation: flowLeft 3s linear forwards;
        }

        @keyframes flowLeft {
            0% {
                left: 120vw;
                opacity: 0.95;
            }
            100% {
                left: -250vw;
                opacity: 0.95;
            }
        }

        #story-overlay {
            position: absolute;
            top: 37.5vh;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 150;
            text-align: center;
            width: 100%;
        }

        .story-line {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.55);
            padding: 10px 30px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .story-line.show {
            opacity: 1;
        }

        /* 実績解除ポップアップ通知 */
        #achievement-popup {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 25, 25, 0.95);
            border: 1px solid rgba(241, 196, 15, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            z-index: 400;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        #achievement-popup.show {
            top: 20px;
        }

        #achievement-popup img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(241, 196, 15, 0.5));
        }

        #achievement-popup .popup-text-wrap {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        #achievement-popup .popup-sub {
            font-size: 0.75rem;
            color: #f1c40f;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #achievement-popup .popup-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <!-- 実績解除ポップアップ通知 -->
    <div id="achievement-popup">
        <img id="popup-icon" src="achahi.png" alt="実績アイコン">
        <div class="popup-text-wrap">
            <span class="popup-sub">実績解除！</span>
            <span id="popup-name" class="popup-name">初めの一投</span>
        </div>
    </div>

    <!-- 右上コントロール群（歯車と電球） -->
    <button id="sound-config-btn" class="top-control top-right-control" title="サウンド設定">⚙️</button>
    <button id="achievement-btn" class="top-control top-right-control" title="実績">💡</button>

    <!-- サウンド設定ポップアップウィンドウ -->
    <div id="sound-modal">
        <div class="setting-row column">
            <span>全体音量: <span id="master-vol-val">100</span>%</span>
            <input type="range" id="master-volume" min="0" max="100" value="100">
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 2px 0;">
        <div class="setting-row">
            <span>BGM</span>
            <label class="switch">
                <input type="checkbox" id="toggle-bgm" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row sub">
            <span>┗ 通常BGMだけ</span>
            <label class="switch">
                <input type="checkbox" id="toggle-normal-bgm" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <span>ボイス</span>
            <label class="switch">
                <input type="checkbox" id="toggle-voice" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 実績ポップアップウィンドウ（背景ディマー付き） -->
    <div id="achievement-dimmer">
        <div id="achievement-modal">
            <button id="achievement-close-btn">&times;</button>
            <div class="achievement-title">🏆 実績一覧</div>
            
            <!-- 横3列のグリッド表示エリア -->
            <div class="achievement-grid" id="achievement-grid">
                <!-- JavaScriptで自動生成されます -->
            </div>

            <!-- クリック時の詳細ビュー -->
            <div id="achievement-detail-view">
                <img id="detail-img" class="detail-img" src="" alt="実績アイコン">
                <div id="detail-name" class="detail-name">実績名</div>
                <div id="detail-desc" class="detail-desc">実績の達成内容説明</div>
                <div id="detail-time" class="detail-time">達成日時: 未達成</div>
                <button class="detail-back-btn" id="detail-back-btn">戻る</button>
            </div>
        </div>
    </div>

    <div id="acha-banner">ACHA</div>
    <div id="pity-banner" class="blink-pity">確定演出ｷﾁｬｰﾋ</div>

    <div id="story-overlay">
        <div id="line-1" class="story-line">あちゃーひはずっと見ていた</div>
        <div id="line-2" class="story-line">ただただ、、、ずっと見ていた</div>
    </div>

    <div id="canvas-container"></div>
    <div id="ui-container">
        <div id="status">準備完了</div>
        <div id="result">【 あ ち ゃ ー ひ 】</div>
        <button id="roll-btn">壺皿に投げる</button>
        
        <!-- 統計情報の表示エリア -->
        <div id="stats-board">
            <div class="stat-item">試行回数: <span id="stat-total">0</span></div>
            <div class="stat-item">あちゃ回数: <span id="stat-acha">0 (0.0%)</span></div>
            <div class="stat-item">あちゃー回数: <span id="stat-achader">0 (0.0%)</span></div>
            <div class="stat-item">あちゃひ回数: <span id="stat-achahi">0 (0.0%)</span></div>
            <div class="stat-item">あちゃーひ回数: <span id="stat-max">0 (0.0%)</span></div>
            <div class="stat-item">あちゃ連続(現在): <span id="stat-streak-curr">0</span></div>
            <div class="stat-item">あちゃ連続(最高): <span id="stat-streak-max">0</span></div>
        </div>
    </div>

    <script>
        // サウンド設定の状態管理
        const soundSettings = {
            masterVolume: 1.0,
            bgm: true,
            normalBgm: true,
            voice: true
        };

        const configBtn = document.getElementById('sound-config-btn');
        const soundModal = document.getElementById('sound-modal');
        const masterVolumeInput = document.getElementById('master-volume');
        const masterVolVal = document.getElementById('master-vol-val');
        const toggleBgm = document.getElementById('toggle-bgm');
        const toggleNormalBgm = document.getElementById('toggle-normal-bgm');
        const toggleVoice = document.getElementById('toggle-voice');

        // 音量取得用のヘルパー関数
        function getNormalBgmVol() {
            if (!soundSettings.bgm || !soundSettings.normalBgm) return 0;
            return soundSettings.masterVolume;
        }

        function getBgmVol() {
            if (!soundSettings.bgm) return 0;
            return soundSettings.masterVolume;
        }

        function getVoiceVol() {
            if (!soundSettings.voice) return 0;
            return soundSettings.masterVolume;
        }

        // 実績ウィンドウ関連の要素
        const achievementBtn = document.getElementById('achievement-btn');
        const achievementDimmer = document.getElementById('achievement-dimmer');
        const achievementCloseBtn = document.getElementById('achievement-close-btn');
        const achievementGrid = document.getElementById('achievement-grid');
        const achievementDetailView = document.getElementById('achievement-detail-view');
        const detailImg = document.getElementById('detail-img');
        const detailName = document.getElementById('detail-name');
        const detailDesc = document.getElementById('detail-desc');
        const detailTime = document.getElementById('detail-time');
        const detailBackBtn = document.getElementById('detail-back-btn');

        // 実績解除ポップアップ用要素 ＆ キュー管理
        const achievementPopup = document.getElementById('achievement-popup');
        const popupIcon = document.getElementById('popup-icon');
        const popupName = document.getElementById('popup-name');
        
        const piconAudio = new Audio('picon.mp3');
        const chonAudio = new Audio('chon.mp3');
        const beAudio = new Audio('be.mp3');
        const ayayaAudio = new Audio('ayayatouya.mp3');

        let achievementQueue = [];
        let isPopupShowing = false;

        function processAchievementQueue() {
            if (isPopupShowing || achievementQueue.length === 0) return;

            isPopupShowing = true;
            const currentAch = achievementQueue.shift();

            popupName.textContent = currentAch.name;
            popupIcon.src = currentAch.icon;
            
            piconAudio.currentTime = 0;
            piconAudio.volume = getVoiceVol();
            piconAudio.play().catch(e => console.log('picon.mp3 再生エラー:', e));

            achievementPopup.classList.add('show');

            setTimeout(() => {
                achievementPopup.classList.remove('show');
                setTimeout(() => {
                    isPopupShowing = false;
                    processAchievementQueue();
                }, 400);
            }, 3500);
        }

        function queueAchievementPopup(achName, achIcon) {
            achievementQueue.push({ name: achName, icon: achIcon });
            processAchievementQueue();
        }

        configBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            achievementDimmer.classList.remove('open');
            soundModal.classList.toggle('open');
        });

        achievementBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundModal.classList.remove('open');
            renderAchievements();
            achievementDimmer.classList.add('open');
        });

        const closeAchievementModal = () => {

                    activeBGM.volume = currentTarget;

                        activeRoll.pause();
                        clearInterval(rollFadeTimer);

                    winAudio.currentTime = 0;

        function createCharTexture(char) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#fdfbf7';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#e0dacf';
            ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, 256, 256);

            if (char) {
                ctx.save();
                ctx.translate(128, 128);

                if (char === 'ち' || char === 'と') {
                    ctx.rotate(Math.PI / 2);
                } else if (char === 'あ' || char === 'ぅ') {
                    ctx.rotate(-Math.PI / 2);
                }

                ctx.fillStyle = (char === 'あ' || char === 'ぅ') ? '#c0392b' : '#2c3e50';
                ctx.font = 'bold 140px "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char, 0, 10);
                
                ctx.restore();
            }

            return new THREE.CanvasTexture(canvas);
        }

            faceNormals.forEach(fn => {
                const normal = fn.vector.clone().applyQuaternion(dice.quaternion);
                const dot = normal.dot(worldUp);
                if (dot > maxDot) {
                    maxDot = dot;

            if (missingChars.length > 0) {

                currentChars.forEach((c, i) => {
                    if (c !== null) {
                        availableIndices.push(i);
                    }
                });

                missingChars.forEach(missingChar => {
                    if (availableIndices.length > 0) {

                        correctionTargets[targetDiceIdx] = missingChar;

        function resolveCollisions() {
            const allDice = [...diceArray, ...extraDiceArray];
            const minDistance = 0.78;

            for (let i = 0; i < allDice.length; i++) {
                for (let j = i + 1; j < allDice.length; j++) {
                    const d1 = allDice[i];
                    const d2 = allDice[j];

                    const dx = d2.position.x - d1.position.x;
                    const dz = d2.position.z - d1.position.z;
                    const dist = Math.hypot(dx, dz);

                    if (dist < minDistance && dist > 0) {
                        const overlap = minDistance - dist;
                        const nx = dx / dist;
                        const nz = dz / dist;

                        d1.position.x -= nx * (overlap * 0.5);
                        d1.position.z -= nz * (overlap * 0.5);
                        d2.position.x += nx * (overlap * 0.5);
                        d2.position.z += nz * (overlap * 0.5);
                    }
                }
            }
        }

        const clock = new THREE.Clock();

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            resolveCollisions();
            
            camera.up.set(0, 1, 0);

            const elapsedTime = clock.getElapsedTime();

            if (isAyayatooLoopActive && surroundAchahiArray.length > 0) {
                const loopTime = elapsedTime - ayayatooLoopStartTime;
                
                surroundAchahiArray.forEach((obj, idx) => {
                    const offset = obj.userData.phaseOffset || (idx * 0.8);
                    obj.position.y = (obj.userData.baseY || 0.5) + Math.sin(loopTime * 2.5 + offset) * 0.25;
                });

                const toggleInterval = 5.0; // 5秒ごとに切り替え
                const cycleIndex = Math.floor(loopTime / toggleInterval) % 2;

                if (cycleIndex === 0) {
                    const progress = (loopTime % toggleInterval) / toggleInterval;
                    const angle = progress * Math.PI * 2 * 0.75;
                    const radius = 6.0;
                    camera.position.set(Math.cos(angle) * radius, 4.5, Math.sin(angle) * radius);
                    camera.lookAt(0, 0, 0);
                } else {
                    camera.position.set(0, 0.8, 3.2);
                    camera.lookAt(0, 0.2, 0);
                }
            } else {
                if (isRolling) {
                    const allDice = [...diceArray, ...extraDiceArray];
                    let avgX = 0, avgY = 0, avgZ = 0;
                    allDice.forEach(d => {
                        avgX += d.position.x;
                        avgY += d.position.y;
                        avgZ += d.position.z;
                    });
                    const count = allDice.length;
                    if (camera.position.z > 1.0) {
                        camera.lookAt(avgX / count, (avgY / count) + 0.2, avgZ / count);
                    } else {
                        camera.lookAt(0, 0, 0);
                    }
                } else {
                    camera.lookAt(cameraTarget);
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
